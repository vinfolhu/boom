name: Build and publish macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run self-tests
        run: swift run BoomPet --self-test

      - name: Build universal app and installers
        env:
          BOOMPET_VERSION: ${{ steps.version.outputs.value }}
          BOOMPET_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoomPet-macOS-universal-${{ steps.version.outputs.value }}
          path: |
            dist/BoomPet-macOS-universal.zip
            dist/BoomPet-macOS-universal.zip.sha256
            dist/BoomPet-macOS-universal.dmg
            dist/BoomPet-macOS-universal.dmg.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BoomPet-macOS-universal.zip \
            dist/BoomPet-macOS-universal.zip.sha256 \
            dist/BoomPet-macOS-universal.dmg \
            dist/BoomPet-macOS-universal.dmg.sha256 \
            --title "BoomPet $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
