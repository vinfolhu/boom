name: Build and publish macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Install optional Developer ID certificate
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$BUILD_CERTIFICATE_BASE64" ]]; then
            echo "No signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          : "${P12_PASSWORD:?Missing P12_PASSWORD secret}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD secret}"
          : "${MACOS_CODESIGN_IDENTITY:?Missing MACOS_CODESIGN_IDENTITY secret}"
          CERTIFICATE_PATH="$RUNNER_TEMP/boompet-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/boompet-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "BOOMPET_CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" \
            >> "$GITHUB_ENV"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run self-tests
        run: swift run BoomPet --self-test

      - name: Build universal app and installers
        env:
          BOOMPET_VERSION: ${{ steps.version.outputs.value }}
          BOOMPET_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoomPet-macOS-universal-${{ steps.version.outputs.value }}
          path: |
            dist/BoomPet-macOS-universal.zip
            dist/BoomPet-macOS-universal.zip.sha256
            dist/BoomPet-macOS-universal.dmg
            dist/BoomPet-macOS-universal.dmg.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/BoomPet-macOS-universal.zip \
            dist/BoomPet-macOS-universal.zip.sha256 \
            dist/BoomPet-macOS-universal.dmg \
            dist/BoomPet-macOS-universal.dmg.sha256 \
            --title "BoomPet $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
